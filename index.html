<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171923"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pretty Dispatch"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon.svg"><title>Pretty Dispatch</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#20232a;font:16px system-ui,-apple-system,sans-serif}.top{background:#171923;color:white;padding:16px;position:sticky;top:0;z-index:2}.top h1{font-size:20px;margin:0}.wrap{max-width:700px;margin:auto;padding:12px}.panel,.job,.stat{background:white;border:1px solid #e4e7ee;border-radius:14px;padding:14px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{margin:0}.stat b{display:block;font-size:25px}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:grid;gap:5px;font-size:13px;color:#555}label.wide{grid-column:1/-1}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #d5d9e2;border-radius:9px;min-width:0;width:100%;background:white}button{background:#252a38;color:white;border:0;cursor:pointer}button.alt{background:#eef0f5;color:#252a38}button.del{background:#fff0f0;color:#a22}.actions,.toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button,.toolbar button{width:auto;flex:1}.muted{color:#777;font-size:12px}.jobhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:12px;background:#e9f6ee;color:#176a3b;border-radius:20px;padding:4px 9px;white-space:nowrap}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.details small{display:block;color:#777;font-size:11px;margin-bottom:2px}.job{border-left:5px solid #d7dce5}.job.alert-red{border-left-color:#dc2626;background:#fff1f1}.job.alert-blue{border-left-color:#2563eb;background:#eff6ff}.job.alert-green{border-left-color:#16a34a}.jobname{font-size:18px}.jobmeta{font-size:12px;color:#596273;margin-top:4px}.catch-btn{background:#176a3b}.catch-btn.pending{background:#eef0f5;color:#252a38}.reset-btn{background:#a22;color:white}.job .actions button{font-size:13px;padding:10px 7px}.hint{font-size:12px;color:#666;background:#f5f6f9;padding:10px;border-radius:9px;margin-top:10px}#cloud{border:1px solid #e4e7ee}#jobs{display:grid;gap:8px}.empty{text-align:center;padding:20px;color:#888}@media(min-width:650px){.wrap{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class="top"><h1>Pretty Dispatch</h1><div id="today" class="muted"></div></header><main class="wrap">
<section class="stats"><div class="stat">登録件数<b id="total">0</b></div><div class="stat">稼働中<b id="active">0</b></div><div class="stat">待機中<b id="waiting">0</b></div><div class="stat">終了・取消<b id="finished">0</b></div></section>
<section class="panel" id="cloud"><h2>クラウド同期</h2><p class="muted" id="cloudState">未接続・この端末内に保存中</p><div class="grid"><label class="wide">Supabase Project URL<input id="url" placeholder="https://xxxx.supabase.co"></label><label class="wide">Publishable / anon key<input id="key" placeholder="Supabase公開キー"></label><label>スタッフメール<input id="email" type="email"></label><label>パスワード<input id="password" type="password"></label></div><div class="toolbar"><button class="alt" id="saveConfig">接続情報を保存</button><button id="login">ログイン・同期</button><button class="alt" id="logout" hidden>ログアウト</button></div><div class="hint">管理者がSupabaseを設定し、スタッフアカウントを発行した後に使用します。秘密鍵（service_role）は入力しないでください。</div></section>
<section class="panel"><h2>文章から仕事を登録</h2><textarea id="raw" rows="3" placeholder="例：きき 22時から23時半、ドライバー田中、キャッチ山田"></textarea><div class="toolbar"><button id="parse">文章を解析</button></div><p class="muted">解析はルールベースです。登録前に内容を確認してください。</p></section>
<section class="panel"><h2 id="formTitle">仕事を登録</h2><form id="form"><div class="grid"><label>女の子<input id="girl" required></label><label>パネル<input id="panel"></label><label class="wide">場所<input id="place"></label><label class="wide">URL<input id="mapUrl" type="url"></label><label>時間（分）<input id="duration" type="number"></label><label>料金（円）<input id="price" type="number"></label><label>決済<input id="payment"></label><label>交通費<input id="travel"></label><label>イベント<input id="event"></label><label>オプション<input id="options"></label><label>お客様名<input id="customer"></label><label>電話番号<input id="phone" type="tel"></label><label class="wide">履歴<input id="history"></label><label>ドライバー<input id="driver"></label><label>キャッチ<input id="catcher"></label><label>アウト時間<input id="out" type="time"></label><label>状態<select id="status"><option>予定</option><option>移動中</option><option>接客中</option><option>待機中</option><option>終了</option><option>キャンセル</option></select></label><label class="wide">メモ<input id="note"></label></div><div class="toolbar"><button id="submit">登録する</button><button type="button" class="alt" id="cancel" hidden>編集をやめる</button></div></form></section>
<section class="panel"><div class="jobhead"><h2>仕事一覧</h2><button class="reset-btn" id="resetDay" style="width:auto">1日の終わり・リセット</button></div><div class="toolbar"><input id="search" placeholder="女の子・担当者・お客様名で検索"><select id="filter"><option value="">すべて</option><option>予定</option><option>移動中</option><option>接客中</option><option>アウト済み</option><option>待機中</option><option>終了</option><option>キャンセル</option></select></div><p class="muted">赤：アウト経過・未キャッチ ／ 青：アウト10分前・ドライバー未決定</p><div id="jobs"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id),STORE='pretty_dispatch_jobs_v1',CFG='pretty_dispatch_cfg_v1';let jobs=JSON.parse(localStorage.getItem(STORE)||'[]'),editing=null,sb=null,channel=null,baseline=new Map(),cloud=false;
$('today').textContent=new Date().toLocaleDateString('ja-JP',{dateStyle:'full'});
function saveLocal(){localStorage.setItem(STORE,JSON.stringify(jobs));render()}
function render(){let active=jobs.filter(x=>['予定','移動中','接客中'].includes(x.status)).length;$('total').textContent=jobs.length;$('active').textContent=active;$('waiting').textContent=jobs.filter(x=>x.status==='待機中').length;$('finished').textContent=jobs.filter(x=>['アウト済み','終了','キャンセル'].includes(x.status)).length;let q=$('search').value.toLowerCase(),f=$('filter').value;let a=jobs.filter(x=>(!f||x.status===f)&&[x.girl,x.driver,x.catcher,x.customer,x.place,x.note].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.out||'').localeCompare(b.out||''));$('jobs').innerHTML=a.length?a.map(x=>{let mins=outMinutes(x.out),now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),past=mins!==null&&mins<=nowMin,soon=mins!==null&&mins>nowMin&&mins-nowMin<=10,red=past&&!x.catchDone,blue=soon&&!String(x.driver||'').trim(),cls=red?'alert-red':blue?'alert-blue':x.catchDone?'alert-green':'';return '<article class="job '+cls+'"><div class="jobhead"><div><b class="jobname">'+esc(x.girl)+'</b><div class="jobmeta">'+esc(x.customer||'お客様未入力')+'　'+esc(x.place||'場所未入力')+'</div></div><span class="pill">'+esc(x.status)+'</span></div><div class="details"><div><small>アウト時間</small><b>'+esc(x.out||'-')+'</b></div><div><small>ドライバー</small><b>'+esc(x.driver||'未決定')+'</b></div><div><small>キャッチ担当</small><b>'+esc(x.catcher||'未入力')+'</b></div><div><small>キャッチ状況</small><b>'+(x.catchDone?'キャッチ済み':'未キャッチ')+'</b></div><div><small>料金・時間</small>'+esc(x.price?Number(x.price).toLocaleString('ja-JP')+'円':'-')+' / '+esc(x.duration?x.duration+'分':'-')+'</div><div><small>電話番号</small>'+esc(x.phone||'-')+'</div><div class="wide"><small>メモ</small>'+esc(x.note||'-')+'</div></div><div class="actions"><button class="catch-btn '+(x.catchDone?'':'pending')+'" onclick="toggleCatch(\''+x.id+'\')">'+(x.catchDone?'キャッチ済み ✓':'キャッチ未完了')+'</button><button class="alt" onclick="editJob(\''+x.id+'\')">編集</button><button class="alt" onclick="nextStatus(\''+x.id+'\')">状態変更</button><button class="del" onclick="deleteJob(\''+x.id+'\')">削除</button></div></article>'}).join(''):'<div class="empty">仕事はまだ登録されていません</div>'}
function outMinutes(v){if(!v||!/^\d{2}:\d{2}$/.test(v))return null;let p=v.split(':').map(Number);return p[0]*60+p[1]}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function row(j){return {id:j.id,girl:j.girl,panel:j.panel||'',place:j.place||'',map_url:j.mapUrl||'',duration:j.duration||'',price:j.price||'',payment:j.payment||'',travel:j.travel||'',event:j.event||'',options:j.options||'',customer:j.customer||'',phone:j.phone||'',history:j.history||'',driver:j.driver||'',catcher:j.catcher||'',catch_done:!!j.catchDone,start_time:j.start||'',out_time:j.out||'',note:j.note||'',status:j.status||'予定',updated_at:j.updatedAt||new Date().toISOString()}}
function fromRow(r){return {id:r.id,girl:r.girl,panel:r.panel||'',place:r.place||'',mapUrl:r.map_url||'',duration:r.duration||'',price:r.price||'',payment:r.payment||'',travel:r.travel||'',event:r.event||'',options:r.options||'',customer:r.customer||'',phone:r.phone||'',history:r.history||'',driver:r.driver||'',catcher:r.catcher||'',catchDone:!!r.catch_done,start:r.start_time||'',out:r.out_time||'',note:r.note||'',status:r.status||'予定',updatedAt:r.updated_at}}
async function sync(){if(!cloud)return;let changed=jobs.filter(j=>baseline.get(j.id)!==JSON.stringify(j));if(changed.length){let {error}=await sb.from('dispatch_jobs').upsert(changed.map(row));if(error){$('cloudState').textContent='保存エラー：'+error.message;return}changed.forEach(j=>baseline.set(j.id,JSON.stringify(j)))}}
$('form').onsubmit=async e=>{e.preventDefault();let j={id:editing||crypto.randomUUID(),girl:$('girl').value.trim(),panel:$('panel').value.trim(),place:$('place').value.trim(),mapUrl:$('mapUrl').value.trim(),duration:$('duration').value,price:$('price').value,payment:$('payment').value,travel:$('travel').value.trim(),event:$('event').value.trim(),options:$('options').value.trim(),customer:$('customer').value.trim(),phone:$('phone').value.trim(),history:$('history').value.trim(),driver:$('driver').value.trim(),catcher:$('catcher').value.trim(),start:'',out:$('out').value,note:$('note').value.trim(),catchDone:editing?(jobs.find(x=>x.id===editing)?.catchDone||false):false,status:$('out').value?'接客中':$('status').value,updatedAt:new Date().toISOString()};jobs=editing?jobs.map(x=>x.id===editing?j:x):[...jobs,j];editing=null;$('form').reset();$('formTitle').textContent='仕事を登録';$('submit').textContent='登録する';$('cancel').hidden=true;saveLocal();await sync()};
window.editJob=id=>{let j=jobs.find(x=>x.id===id);if(!j)return;editing=id;for(let k of ['girl','panel','place','driver','catcher','out','note','status','duration','price','payment','travel','event','options','customer','phone','history'])$(k).value=j[k]||'';$('mapUrl').value=j.mapUrl||'';$('formTitle').textContent='仕事を編集';$('submit').textContent='変更を保存';$('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};
$('cancel').onclick=()=>{editing=null;$('form').reset();$('formTitle').textContent='仕事を登録';$('submit').textContent='登録する';$('cancel').hidden=true};
window.deleteJob=async id=>{if(!confirm('削除しますか？'))return;jobs=jobs.filter(x=>x.id!==id);saveLocal();baseline.delete(id);if(cloud){let {error}=await sb.from('dispatch_jobs').delete().eq('id',id);if(error)$('cloudState').textContent='削除エラー：'+error.message}};
window.nextStatus=async id=>{let order=['予定','移動中','接客中','アウト済み','待機中','終了','キャンセル'];jobs=jobs.map(x=>x.id===id?{...x,status:order[(order.indexOf(x.status)+1)%order.length]}:x);saveLocal();await sync()};window.toggleCatch=async id=>{jobs=jobs.map(x=>x.id===id?{...x,catchDone:!x.catchDone,updatedAt:new Date().toISOString()}:x);saveLocal();await sync()};function applyTimeRules(){let now=new Date(),n=now.getHours()*60+now.getMinutes(),changed=false;jobs=jobs.map(x=>{if(!x.out||['キャンセル','終了'].includes(x.status))return x;let m=outMinutes(x.out);if(m===null)return x;let target=m;if(m<n-720)target+=1440;let status=target<=n?'アウト済み':'接客中';if(x.status!==status){changed=true;return {...x,status,updatedAt:new Date().toISOString()}}return x});if(changed){saveLocal();sync() }else render()};$('resetDay').onclick=async()=>{if(!jobs.length){alert('リセットする仕事はありません');return}if(!confirm('登録されている仕事 '+jobs.length+' 件をすべて削除して、1日分をリセットします。\nこの操作は元に戻せません。実行しますか？'))return;if(cloud){let {error}=await sb.from('dispatch_jobs').delete().gte('updated_at','1970-01-01T00:00:00Z');if(error){alert('クラウド側の削除に失敗しました。リセットを中止します。');$('cloudState').textContent='リセット失敗：'+error.message;return}}jobs=[];baseline.clear();saveLocal();alert('1日分の仕事をリセットしました')};
$('search').oninput=render;$('filter').onchange=render;
$('parse').onclick=()=>{let t=$('raw').value;const get=k=>{let m=t.match(new RegExp('(?:^|\\n)[ \\t]*'+k+'[ \\t]*[：:][ \\t]*([^\\r\\n]*)','i'));return(m?.[1]||'').trim()};const keys={girl:'女の子',panel:'パネル',place:'場所',mapUrl:'URL',duration:'時間',price:'料金',payment:'決済',travel:'交通費',event:'イベント',options:'オプション',out:'アウト(?:時間)?',customer:'お客様名',phone:'電話番号',history:'履歴',driver:'ドライバー',catcher:'キャッチ'};for(const [id,k] of Object.entries(keys)){let v=get(k);if(id==='duration')v=v.replace(/分/g,'');if(id==='price')v=v.replace(/[円,，]/g,'');if(id==='out'&&v){v=v.replace(/[：]/g,':').replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/\s/g,'');let m=v.match(/^(\d{1,2})[:時](\d{1,2})分?$/);if(m){let h=Number(m[1]),min=Number(m[2]);v=h<=23&&min<=59?String(h).padStart(2,'0')+':'+String(min).padStart(2,'0'):''}else{let m2=v.match(/^(\d{1,2}):(\d{2})$/);v=m2&&Number(m2[1])<=23&&Number(m2[2])<=59?String(Number(m2[1])).padStart(2,'0')+':'+m2[2]:''}}$(id).value=v}};
$('saveConfig').onclick=()=>{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co\/?$/.test(url)||!key){$('cloudState').textContent='Project URLと公開キーを確認してください';return}localStorage.setItem(CFG,JSON.stringify({url:url.replace(/\/$/,''),key}));$('cloudState').textContent='接続情報を保存しました'};
let cfg=JSON.parse(localStorage.getItem(CFG)||'{}');$('url').value=cfg.url||'';$('key').value=cfg.key||'';
$('login').onclick=async()=>{if(!window.supabase?.createClient){$('cloudState').textContent='Supabaseライブラリを読み込めません';return}if(!cfg.url||!cfg.key){$('saveConfig').click();cfg=JSON.parse(localStorage.getItem(CFG)||'{}');if(!cfg.url)return}sb=window.supabase.createClient(cfg.url,cfg.key);let {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('cloudState').textContent='ログインエラー：'+error.message;return}cloud=true;$('logout').hidden=false;let res=await sb.from('dispatch_jobs').select('*');if(res.error){$('cloudState').textContent='DBエラー：'+res.error.message;return}if(!res.data.length&&jobs.length){let seed=await sb.from('dispatch_jobs').upsert(jobs.map(row));if(seed.error){$('cloudState').textContent='初回移行エラー：'+seed.error.message;return}}else{jobs=res.data.map(fromRow);saveLocal()}baseline=new Map(jobs.map(j=>[j.id,JSON.stringify(j)]));$('cloudState').textContent='クラウド同期中';channel=sb.channel('jobs-live').on('postgres_changes',{event:'*',schema:'public',table:'dispatch_jobs'},p=>{if(p.eventType==='DELETE')jobs=jobs.filter(j=>j.id!==p.old.id);else{let j=fromRow(p.new),i=jobs.findIndex(x=>x.id===j.id);if(i<0)jobs.push(j);else jobs[i]=j}localStorage.setItem(STORE,JSON.stringify(jobs));render()}).subscribe()};
$('logout').onclick=async()=>{if(sb)await sb.auth.signOut();if(channel)await sb.removeChannel(channel);cloud=false;$('logout').hidden=true;$('cloudState').textContent='ログアウトしました'};
applyTimeRules();setInterval(applyTimeRules,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
