<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171923"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pretty Dispatch"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon.svg"><title>Pretty Dispatch</title>
<style>

.detail-modal{position:fixed;inset:0;background:rgba(15,18,28,.65);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.detail-box{background:#fff;width:min(620px,100%);max-height:90dvh;overflow:auto;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0005}.detail-title{font-size:22px;margin:0 0 10px}.modal-close{width:40px;height:40px;flex:0 0 40px;padding:0;border-radius:50%;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-item{border-bottom:1px solid #e5e7eb;padding:7px 0;min-width:0;overflow-wrap:anywhere}.detail-item small{display:block;color:#777;font-size:11px}.detail-item b{font-size:15px}.detail-actions{display:flex;gap:8px;margin-top:14px}.detail-actions button{flex:1}.job{cursor:pointer}.map-btn{background:#1769aa}</style></head><body>
<header class="top"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Pretty Dispatch</h1><button type="button" id="appRefresh" style="width:auto;padding:8px 12px;background:#fff;color:#171923;font-size:12px;font-weight:700">更新</button></div><div id="today" class="muted"></div><div id="appUpdateState" class="muted" style="color:#cbd5e1">更新ボタンで最新版を読み込みます</div></header><div id="detailModal" class="detail-modal" hidden onclick="if(event.target===this)closeDetail()"><section class="detail-box"><div class="jobhead"><h2 class="detail-title" id="detailTitle">仕事詳細</h2><button type="button" class="alt modal-close" aria-label="閉じる" onclick="closeDetail()">×</button></div><div id="detailContent" class="detail-grid"></div><div class="detail-actions"><button type="button" class="map-btn" id="detailMap">地図アプリで開く</button><button type="button" class="alt" id="detailEdit">編集</button></div></section></div>
<main class="wrap">
<section class="stats"><div class="stat">登録件数<b id="total">0</b></div><div class="stat">稼働中<b id="active">0</b></div><div class="stat">待機中<b id="waiting">0</b></div><div class="stat">終了・取消<b id="finished">0</b></div></section>
<section class="panel"><button type="button" class="alt" id="cloudToggle">クラウド同期を開く</button></section>
<section class="panel" id="cloud" hidden><h2>クラウド同期</h2><p class="muted" id="cloudState">未接続・この端末内に保存中</p><div class="grid"><label class="wide">Supabase Project URL<input id="url" placeholder="https://xxxx.supabase.co"></label><label class="wide">Publishable / anon key<input id="key" placeholder="Supabase公開キー"></label><label>スタッフメール<input id="email" type="email"></label><label>パスワード<input id="password" type="password"></label></div><div class="toolbar"><button class="alt" id="saveConfig">接続情報を保存</button><button id="login">ログイン・同期</button><button class="alt" id="logout" hidden>ログアウト</button></div><div class="hint">管理者がSupabaseを設定し、スタッフアカウントを発行した後に使用します。秘密鍵（service_role）は入力しないでください。</div></section>
<section class="panel"><h2>仕事を入力</h2><textarea id="raw" rows="3" placeholder="例：きき 22時から23時半、ドライバー田中、キャッチ山田"></textarea><div class="toolbar"><button id="parse">仕事を入力</button></div><p class="muted">解析はルールベースです。登録前に内容を確認してください。</p></section>
<section class="panel"><div class="toolbar"><button type="button" id="showInput">＋ 仕事を入力</button></div></section>
<section class="panel" id="inputPanel" hidden><h2 id="formTitle">仕事を登録</h2><form id="form"><div class="grid"><label>女の子<input id="girl" required></label><label>パネル<input id="panel"></label><label class="wide">場所<input id="place"></label><label class="wide">URL<input id="mapUrl" type="url"></label><label>時間（分）<input id="duration" type="number"></label><label>料金（円）<input id="price" type="number"></label><label>決済<input id="payment"></label><label>交通費<input id="travel"></label><label>イベント<input id="event"></label><label>オプション<input id="options"></label><label>お客様名<input id="customer"></label><label>電話番号<input id="phone" type="tel"></label><label class="wide">履歴<input id="history"></label><label>ドライバー<input id="driver"></label><label>キャッチ<input id="catcher"></label><label>アウト時間<input id="out" type="time"></label><label>状態<select id="status"><option>予定</option><option>移動中</option><option>接客中</option><option>待機中</option><option>終了</option><option>キャンセル</option></select></label><label class="wide">メモ<input id="note"></label></div><div class="toolbar"><button id="submit">登録する</button><button type="button" class="alt" id="cancel" hidden>編集をやめる</button></div></form></section>
<section class="panel"><div class="jobhead"><h2>仕事一覧</h2><button class="reset-btn" id="resetDay" style="width:auto">1日の終わり・リセット</button></div><div class="toolbar"><input id="search" placeholder="女の子・担当者・お客様名で検索"><select id="filter"><option value="">すべて</option><option>予定</option><option>移動中</option><option>接客中</option><option>アウト済み</option><option>待機中</option><option>終了</option><option>キャンセル</option></select></div><p class="muted">赤：アウト経過・未キャッチ ／ 青：アウト10分前・ドライバー未決定</p><div id="jobs"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id),STORE='pretty_dispatch_jobs_v1',CFG='pretty_dispatch_cfg_v1';let jobs=JSON.parse(localStorage.getItem(STORE)||'[]'),editing=null,sb=null,channel=null,baseline=new Map(),cloud=false;
$('today').textContent=new Date().toLocaleDateString('ja-JP',{dateStyle:'full'});
function saveLocal(){localStorage.setItem(STORE,JSON.stringify(jobs));render()}
function render(){let active=jobs.filter(x=>['予定','移動中','接客中'].includes(x.status)).length;$('total').textContent=jobs.length;$('active').textContent=active;$('waiting').textContent=jobs.filter(x=>x.status==='待機中').length;$('finished').textContent=jobs.filter(x=>['アウト済み','終了','キャンセル'].includes(x.status)).length;let q=$('search').value.toLowerCase(),f=$('filter').value;let a=jobs.filter(x=>(!f||x.status===f)&&[x.girl,x.driver,x.catcher,x.customer,x.place,x.note].join(' ').toLowerCase().includes(q)).sort((a,b)=>(Number(!!a.catchDone)-Number(!!b.catchDone))||(a.out||'').localeCompare(b.out||''));$('jobs').innerHTML=a.length?a.map(x=>{let mins=outMinutes(x.out),now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),target=mins!==null&&mins<nowMin-720?mins+1440:mins,past=target!==null&&target<=nowMin,soon=target!==null&&target>nowMin&&target-nowMin<=10,red=past&&!x.catchDone,blue=soon&&!String(x.driver||'').trim(),cls=red?'alert-red':blue?'alert-blue':x.catchDone?'alert-green':'';return '<article class="job '+cls+'" onclick="openDetail(\''+x.id+'\')"><div class="jobhead"><div><b class="jobname">'+esc(x.girl)+'</b><div class="jobmeta">'+esc(x.panel||'パネル未設定')+' / '+esc(x.customer||'お客様未入力')+'</div></div><span class="pill '+(x.catchDone?'done':'')+'">'+esc(x.catchDone?'終了':x.status)+'</span></div><div class="details"><div><small>時間・料金</small><b>'+esc(x.duration||'-')+'分 / '+esc(x.price?Number(x.price).toLocaleString('ja-JP')+'円':'-')+'</b></div><div><small>アウト</small><b>'+esc(x.out||'-')+'</b></div><div><small>場所</small>'+esc(x.place||'-')+'</div><div><small>ドライバー</small>'+esc(x.driver||'未決定')+'</div><div><small>キャッチ</small>'+esc(x.catcher||'未入力')+'</div><div><small>キャッチ状況</small><b>'+(x.catchDone?'終了 ✓':'未')+'</b></div></div><div class="jobmeta">タップして詳細を表示</div><div class="actions"><button class="catch-btn '+(x.catchDone?'':'pending')+'" onclick="event.stopPropagation();toggleCatch(\''+x.id+'\')">'+(x.catchDone?'終了 ✓':'キャッチ未完了')+'</button><button class="alt" onclick="event.stopPropagation();editJob(\''+x.id+'\')">編集</button><button class="alt" onclick="event.stopPropagation();nextStatus(\''+x.id+'\')">状態変更</button><button class="del" onclick="event.stopPropagation();deleteJob(\''+x.id+'\')">削除</button></div></article>'}).join(''):'<div class="empty">仕事はまだ登録されていません</div>'}
function detailField(label,value){return '<div class="detail-item"><small>'+label+'</small><b>'+esc(value||'-')+'</b></div>'}
window.openDetail=id=>{let x=jobs.find(j=>j.id===id);if(!x)return;$('detailTitle').textContent=x.girl+' の詳細';$('detailContent').innerHTML=detailField('状態',x.status)+detailField('パネル',x.panel)+detailField('場所',x.place)+detailField('時間',x.duration?x.duration+'分':'-')+detailField('料金',x.price?Number(x.price).toLocaleString('ja-JP')+'円':'-')+detailField('決済',x.payment)+detailField('交通費',x.travel)+detailField('イベント',x.event)+detailField('オプション',x.options)+detailField('お客様名',x.customer)+detailField('電話番号',x.phone)+detailField('履歴',x.history)+detailField('ドライバー',x.driver)+detailField('キャッチ担当',x.catcher)+detailField('アウト時間',x.out)+detailField('キャッチ状況',x.catchDone?'終了':'未キャッチ')+detailField('メモ',x.note);$('detailMap').hidden=!(x.mapUrl||x.place);$('detailMap').onclick=()=>openMap(id);$('detailEdit').onclick=()=>{closeDetail();editJob(id)};$('detailModal').hidden=false};
window.closeDetail=()=>{$('detailModal').hidden=true};
window.openMap=id=>{let x=jobs.find(j=>j.id===id);if(!x)return;let dest=x.mapUrl||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.place||''));window.location.href=dest};
function outMinutes(v){if(!v||!/^\d{2}:\d{2}$/.test(v))return null;let p=v.split(':').map(Number);return p[0]*60+p[1]}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function row(j){return {id:j.id,girl:j.girl,panel:j.panel||'',place:j.place||'',map_url:j.mapUrl||'',duration:j.duration||'',price:j.price||'',payment:j.payment||'',travel:j.travel||'',event:j.event||'',options:j.options||'',customer:j.customer||'',phone:j.phone||'',history:j.history||'',driver:j.driver||'',catcher:j.catcher||'',catch_done:!!j.catchDone,start_time:j.start||'',out_time:j.out||'',note:j.note||'',status:j.status||'予定',updated_at:j.updatedAt||new Date().toISOString()}}
function fromRow(r){return {id:r.id,girl:r.girl,panel:r.panel||'',place:r.place||'',mapUrl:r.map_url||'',duration:r.duration||'',price:r.price||'',payment:r.payment||'',travel:r.travel||'',event:r.event||'',options:r.options||'',customer:r.customer||'',phone:r.phone||'',history:r.history||'',driver:r.driver||'',catcher:r.catcher||'',catchDone:!!r.catch_done,start:r.start_time||'',out:r.out_time||'',note:r.note||'',status:r.status||'予定',updatedAt:r.updated_at}}
async function sync(){if(!cloud)return;let changed=jobs.filter(j=>baseline.get(j.id)!==JSON.stringify(j));if(changed.length){let {error}=await sb.from('dispatch_jobs').upsert(changed.map(row));if(error){$('cloudState').textContent='保存エラー：'+error.message;return}changed.forEach(j=>baseline.set(j.id,JSON.stringify(j)))}}
$('form').onsubmit=async e=>{e.preventDefault();let j={id:editing||crypto.randomUUID(),girl:$('girl').value.trim(),panel:$('panel').value.trim(),place:$('place').value.trim(),mapUrl:$('mapUrl').value.trim(),duration:$('duration').value,price:$('price').value,payment:$('payment').value,travel:$('travel').value.trim(),event:$('event').value.trim(),options:$('options').value.trim(),customer:$('customer').value.trim(),phone:$('phone').value.trim(),history:$('history').value.trim(),driver:$('driver').value.trim(),catcher:$('catcher').value.trim(),start:'',out:$('out').value,note:$('note').value.trim(),catchDone:editing?(jobs.find(x=>x.id===editing)?.catchDone||false):false,status:$('out').value?'接客中':$('status').value,updatedAt:new Date().toISOString()};jobs=editing?jobs.map(x=>x.id===editing?j:x):[...jobs,j];editing=null;$('form').reset();$('formTitle').textContent='仕事を登録';$('submit').textContent='登録する';$('cancel').hidden=true;$('inputPanel').hidden=true;$('showInput').textContent='＋ 仕事を入力';saveLocal();await sync()};
window.editJob=id=>{let j=jobs.find(x=>x.id===id);if(!j)return;editing=id;$('inputPanel').hidden=false;$('showInput').textContent='入力画面を閉じる';for(let k of ['girl','panel','place','driver','catcher','out','note','status','duration','price','payment','travel','event','options','customer','phone','history'])$(k).value=j[k]||'';$('mapUrl').value=j.mapUrl||'';$('formTitle').textContent='仕事を編集';$('submit').textContent='変更を保存';$('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};
$('cancel').onclick=()=>{editing=null;$('form').reset();$('formTitle').textContent='仕事を登録';$('submit').textContent='登録する';$('cancel').hidden=true;$('inputPanel').hidden=true;$('showInput').textContent='＋ 仕事を入力'};
window.deleteJob=async id=>{if(!confirm('削除しますか？'))return;jobs=jobs.filter(x=>x.id!==id);saveLocal();baseline.delete(id);if(cloud){let {error}=await sb.from('dispatch_jobs').delete().eq('id',id);if(error)$('cloudState').textContent='削除エラー：'+error.message}};
window.nextStatus=async id=>{let order=['予定','移動中','接客中','アウト済み','待機中','終了','キャンセル'];jobs=jobs.map(x=>x.id===id?{...x,status:order[(order.indexOf(x.status)+1)%order.length]}:x);saveLocal();await sync()};window.toggleCatch=async id=>{jobs=jobs.map(x=>x.id===id?{...x,catchDone:!x.catchDone,updatedAt:new Date().toISOString()}:x);saveLocal();await sync()};function applyTimeRules(){let now=new Date(),n=now.getHours()*60+now.getMinutes(),changed=false;jobs=jobs.map(x=>{if(!x.out||['キャンセル','終了'].includes(x.status))return x;let m=outMinutes(x.out);if(m===null)return x;let target=m;if(m<n-720)target+=1440;let status=target<=n?'アウト済み':'接客中';if(x.status!==status){changed=true;return {...x,status,updatedAt:new Date().toISOString()}}return x});if(changed){saveLocal();sync() }else render()};$('resetDay').onclick=async()=>{if(!jobs.length){alert('リセットする仕事はありません');return}if(!confirm('登録されている仕事 '+jobs.length+' 件をすべて削除して、1日分をリセットします。\nこの操作は元に戻せません。実行しますか？'))return;if(cloud){let {error}=await sb.from('dispatch_jobs').delete().gte('updated_at','1970-01-01T00:00:00Z');if(error){alert('クラウド側の削除に失敗しました。リセットを中止します。');$('cloudState').textContent='リセット失敗：'+error.message;return}}jobs=[];baseline.clear();saveLocal();alert('1日分の仕事をリセットしました')};
 $('showInput').onclick=()=>{let opening=$('inputPanel').hidden;$('inputPanel').hidden=!opening;$('showInput').textContent=opening?'入力画面を閉じる':'＋ 仕事を入力';if(opening){editing=null;$('form').reset();$('formTitle').textContent='仕事を登録';$('submit').textContent='登録する';$('cancel').hidden=true}};
$('cloudToggle').onclick=()=>{let opening=$('cloud').hidden;$('cloud').hidden=!opening;$('cloudToggle').textContent=opening?'クラウド同期を閉じる':'クラウド同期を開く'};
$('search').oninput=render;$('filter').onchange=render;
$('parse').onclick=()=>{let t=$('raw').value;const get=k=>{let m=t.match(new RegExp('(?:^|\\n)[ \\t]*'+k+'[ \\t]*[：:][ \\t]*([^\\r\\n]*)','i'));return(m?.[1]||'').trim()};const keys={girl:'女の子',panel:'パネル',place:'場所',mapUrl:'URL',duration:'時間',price:'料金',payment:'決済',travel:'交通費',event:'イベント',options:'オプション',out:'アウト(?:時間)?',customer:'お客様名',phone:'電話番号',history:'履歴',driver:'ドライバー',catcher:'キャッチ'};for(const [id,k] of Object.entries(keys)){let v=get(k);if(id==='duration')v=v.replace(/分/g,'');if(id==='price')v=v.replace(/[円,，]/g,'');if(id==='out'&&v){v=v.replace(/[：]/g,':').replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/\s/g,'');let m=v.match(/^(\d{1,2})[:時](\d{1,2})分?$/);if(m){let h=Number(m[1]),min=Number(m[2]);v=h<=23&&min<=59?String(h).padStart(2,'0')+':'+String(min).padStart(2,'0'):''}else{let m2=v.match(/^(\d{1,2}):(\d{2})$/);v=m2&&Number(m2[1])<=23&&Number(m2[2])<=59?String(Number(m2[1])).padStart(2,'0')+':'+m2[2]:''}}$(id).value=v}};
$('saveConfig').onclick=()=>{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co\/?$/.test(url)||!key){$('cloudState').textContent='Project URLと公開キーを確認してください';return}localStorage.setItem(CFG,JSON.stringify({url:url.replace(/\/$/,''),key}));$('cloudState').textContent='接続情報を保存しました'};
let cfg=JSON.parse(localStorage.getItem(CFG)||'{}');$('url').value=cfg.url||'';$('key').value=cfg.key||'';
$('login').onclick=async()=>{if(!window.supabase?.createClient){$('cloudState').textContent='Supabaseライブラリを読み込めません';return}if(!cfg.url||!cfg.key){$('saveConfig').click();cfg=JSON.parse(localStorage.getItem(CFG)||'{}');if(!cfg.url)return}sb=window.supabase.createClient(cfg.url,cfg.key);let {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('cloudState').textContent='ログインエラー：'+error.message;return}cloud=true;$('logout').hidden=false;let res=await sb.from('dispatch_jobs').select('*');if(res.error){$('cloudState').textContent='DBエラー：'+res.error.message;return}if(!res.data.length&&jobs.length){let seed=await sb.from('dispatch_jobs').upsert(jobs.map(row));if(seed.error){$('cloudState').textContent='初回移行エラー：'+seed.error.message;return}}else{jobs=res.data.map(fromRow);saveLocal()}baseline=new Map(jobs.map(j=>[j.id,JSON.stringify(j)]));$('cloudState').textContent='クラウド同期中';$('cloudToggle').textContent='クラウド同期中（設定を開く）';channel=sb.channel('jobs-live').on('postgres_changes',{event:'*',schema:'public',table:'dispatch_jobs'},p=>{if(p.eventType==='DELETE')jobs=jobs.filter(j=>j.id!==p.old.id);else{let j=fromRow(p.new),i=jobs.findIndex(x=>x.id===j.id);if(i<0)jobs.push(j);else jobs[i]=j}localStorage.setItem(STORE,JSON.stringify(jobs));render()}).subscribe()};
$('logout').onclick=async()=>{if(sb)await sb.auth.signOut();if(channel)await sb.removeChannel(channel);cloud=false;$('logout').hidden=true;$('cloudState').textContent='ログアウトしました';$('cloudToggle').textContent='クラウド同期を開く'};
applyTimeRules();setInterval(applyTimeRules,60000);
let appReg=null,appReloading=false;
function reloadLatest(){if(appReloading)return;appReloading=true;$('appUpdateState').textContent='最新版を読み込み中…';let u=new URL(location.href);u.searchParams.set('refresh',Date.now());location.replace(u.href)}
async function checkLatest(force=false){if(!('serviceWorker'in navigator)){if(force)reloadLatest();return}try{if(!appReg)appReg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await appReg.update();$('appUpdateState').textContent='更新確認：'+new Date().toLocaleTimeString('ja-JP');if(force)reloadLatest()}catch(e){$('appUpdateState').textContent='更新確認に失敗。通信状態を確認してください';if(force)reloadLatest()}}
navigator.serviceWorker?.addEventListener('controllerchange',()=>{if(!appReloading){appReloading=true;location.reload()}});
$('appRefresh').onclick=()=>checkLatest(true);
checkLatest(false);setInterval(()=>{if(document.visibilityState==='visible')checkLatest(false)},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkLatest(false)});
</script></body></html>
